<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f35">
  <title>GAIL Gas PNG | Resident FAQ</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17231f;
      --muted: #65736c;
      --green: #173f35;
      --green-soft: #e9f1ec;
      --lime: #d6e85b;
      --paper: #f6f7f2;
      --white: #fff;
      --line: #dce3dc;
      --coral: #c4543d;
      font-family: "Aptos", "Segoe UI Variable", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#dfe6dc 0.65px, transparent 0.65px);
      background-size: 13px 13px;
    }

    .masthead {
      color: var(--white);
      background: var(--green);
      border-bottom: 5px solid var(--lime);
    }

    .masthead-inner, main {
      width: min(100% - 40px, 880px);
      margin-inline: auto;
    }

    .masthead-inner { padding: 30px 0 34px; }

    .identity {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 25px;
      color: #dbe6df;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .identity-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      color: var(--green);
      background: var(--lime);
      border-radius: 7px 7px 7px 2px;
      font-size: 12px;
      font-weight: 800;
    }

    h1 {
      max-width: 650px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 44px;
      font-weight: 500;
      line-height: 1.08;
    }

    .intro {
      margin: 12px 0 0;
      color: #d0ddd4;
      font-size: 16px;
    }

    .assistant-link {
      display: inline-block;
      margin-top: 18px;
      padding: 8px 0;
      color: var(--lime);
      font-size: 15px;
      font-weight: 650;
      text-underline-offset: 4px;
      overflow-wrap: anywhere;
    }

    .assistant-link:hover { color: var(--white); }
    .assistant-link:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 4px;
    }

    main { padding: 27px 0 64px; }

    .search-panel {
      position: relative;
      margin-bottom: 20px;
    }

    .search-panel label {
      display: block;
      margin-bottom: 8px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
    }

    .search-wrap { position: relative; }

    .search-mark {
      position: absolute;
      top: 50%;
      left: 16px;
      width: 15px;
      height: 15px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      transform: translateY(-60%);
      pointer-events: none;
    }

    .search-mark::after {
      position: absolute;
      right: -6px;
      bottom: -4px;
      width: 7px;
      height: 2px;
      background: var(--muted);
      content: "";
      transform: rotate(48deg);
    }

    #search {
      width: 100%;
      min-height: 54px;
      padding: 13px 48px;
      color: var(--ink);
      background: var(--white);
      border: 1px solid #cbd5cd;
      border-radius: 8px;
      box-shadow: 0 2px 8px #183d3210;
      font: inherit;
      font-size: 16px;
    }

    #search:focus-visible {
      outline: 3px solid #a9c34b;
      outline-offset: 2px;
    }

    #clear-search {
      position: absolute;
      top: 50%;
      right: 10px;
      display: none;
      width: 34px;
      height: 34px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 5px;
      font: inherit;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      transform: translateY(-50%);
    }

    #clear-search:hover { color: var(--coral); background: #f6ebe7; }

    .results-line {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      min-height: 22px;
      margin: 0 2px 12px;
      color: var(--muted);
      font-size: 13px;
    }

    #results { display: grid; gap: 9px; }

    .faq-item {
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--line);
      border-left: 3px solid #9ab14c;
      border-radius: 6px;
      box-shadow: 0 2px 7px #20392f08;
      animation: arrive 260ms ease both;
    }

    .faq-item h2 {
      margin: 0;
      padding: 17px 20px 2px;
      color: var(--green);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.4;
    }

    .answer {
      padding: 6px 20px 18px;
      color: #34413b;
      font-size: 15px;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .answer p { margin: 7px 0; }
    .answer p:first-child { margin-top: 0; }
    .answer ul { margin: 7px 0; padding-left: 22px; }
    .answer li { padding-left: 3px; margin: 4px 0; }
    .answer strong { color: #203c31; }
    .answer a { color: #176b5a; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .answer a:hover { color: var(--coral); }

    .state {
      padding: 28px 20px;
      color: var(--muted);
      background: var(--white);
      border: 1px dashed #bac8bd;
      border-radius: 6px;
      text-align: center;
      line-height: 1.5;
    }

    .state.error { color: #813927; background: #fff7f3; border-color: #e2b9aa; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; scroll-behavior: auto !important; }
    }

    @media (max-width: 560px) {
      .masthead-inner, main { width: min(100% - 28px, 880px); }
      .masthead-inner { padding: 22px 0 27px; }
      .identity { margin-bottom: 20px; }
      h1 { font-size: 32px; }
      main { padding-top: 21px; }
      .faq-item h2 { padding: 15px 15px 2px; font-size: 16px; }
      .answer { padding: 6px 15px 15px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="identity"><span class="identity-mark" aria-hidden="true">PNG</span> Resident information</div>
      <h1>GAIL Gas PNG FAQ</h1>
      <p class="intro">Answers to common questions about GAIL Gas PNG connections.</p>
      <a class="assistant-link" href="https://gailgasconnection.streamlit.app/" target="_blank" rel="noopener noreferrer">Ask the AI assistant <span aria-hidden="true">&#8599;</span><span class="assistant-link-context"> (opens in a new tab)</span></a>
    </div>
  </header>

  <main>
    <div class="search-panel">
      <label for="search">Search questions and answers</label>
      <div class="search-wrap">
        <span class="search-mark" aria-hidden="true"></span>
        <input id="search" type="search" autocomplete="off" placeholder="Try “security deposit” or “gas leak”">
        <button id="clear-search" type="button" aria-label="Clear search" title="Clear search">×</button>
      </div>
    </div>
    <div class="results-line" aria-live="polite"><span id="result-count">Loading FAQ…</span></div>
    <section id="results" aria-label="FAQ results"></section>
  </main>

  <script>
    const FAQ_SOURCE = "docs/GAIL_Gas_PNG_Resident_FAQ.md";
    const searchInput = document.querySelector("#search");
    const clearButton = document.querySelector("#clear-search");
    const resultCount = document.querySelector("#result-count");
    const results = document.querySelector("#results");
    let faqItems = [];

    function parseFaq(markdown) {
      const sections = markdown.split(/(?=^\*{0,2}##\s+FAQ-\d+:\s)/m).slice(1);

      return sections.flatMap((section) => {
        const lines = section.split(/\r?\n/);
        const question = lines[0]
          .replace(/^\*{0,2}##\s+FAQ-\d+:\s*/, "")
          .replace(/\*{0,2}\s*$/, "")
          .trim();
        const answerIndex = lines.findIndex((line) => /^\*\*Answer:\*\*/.test(line.trim()));
        if (!question || answerIndex < 0) return [];

        const firstAnswerLine = lines[answerIndex].trim().replace(/^\*\*Answer:\*\*\s*/, "");
        const answerLines = [firstAnswerLine, ...lines.slice(answerIndex + 1)];
        const separatorIndex = answerLines.findIndex((line) => /^\*\*---\*\*\s*$/.test(line.trim()));
        const answer = answerLines.slice(0, separatorIndex < 0 ? undefined : separatorIndex).join("\n").trim();
        return answer ? [{ question, answer }] : [];
      });
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      })[character]);
    }

    function renderInline(text) {
      const links = [];
      let html = escapeHtml(text).replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_match, label, url) => {
        const index = links.push(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`) - 1;
        return `@@FAQ_LINK_${index}@@`;
      });

      html = html.replace(/https?:\/\/[^\s<]+/g, (candidate) => {
        const url = candidate.replace(/[.,;:!?]+$/, "");
        const trailing = candidate.slice(url.length);
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>${trailing}`;
      });
      html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      return html.replace(/@@FAQ_LINK_(\d+)@@/g, (_match, index) => links[Number(index)]);
    }

    function renderMarkdown(markdown) {
      const blocks = [];
      let paragraph = [];
      let list = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        blocks.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
        paragraph = [];
      }

      function flushList() {
        if (!list.length) return;
        blocks.push(`<ul>${list.map((item) => `<li>${renderInline(item)}</li>`).join("")}</ul>`);
        list = [];
      }

      for (const line of markdown.split(/\r?\n/)) {
        const bullet = line.match(/^\s*-\s+(.*)$/);
        if (bullet) {
          flushParagraph();
          list.push(bullet[1]);
        } else if (!line.trim()) {
          flushParagraph();
          flushList();
        } else {
          flushList();
          paragraph.push(line.trim());
        }
      }
      flushParagraph();
      flushList();
      return blocks.join("");
    }

    function normalize(text) {
      return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function score(item, query) {
      const normalizedQuery = normalize(query.trim());
      const terms = normalizedQuery.match(/[a-z0-9]+/g) || [];
      if (!terms.length) return 0;

      const question = normalize(item.question);
      const answer = normalize(item.answer);
      let relevance = question.includes(normalizedQuery) ? 12 : answer.includes(normalizedQuery) ? 5 : 0;

      for (const term of terms) {
        if (question.includes(term)) relevance += question.split(term).length > 1 ? 4 : 0;
        if (answer.includes(term)) relevance += 1;
      }
      return relevance;
    }

    function render() {
      const query = searchInput.value.trim();
      clearButton.style.display = query ? "block" : "none";
      const matches = faqItems
        .map((item, index) => ({ item, index, relevance: score(item, query) }))
        .filter((result) => !query || result.relevance > 0)
        .sort((left, right) => right.relevance - left.relevance || left.index - right.index);

      resultCount.textContent = query
        ? `${matches.length} ${matches.length === 1 ? "answer" : "answers"} found`
        : `${faqItems.length} answers`;
      results.replaceChildren();

      if (!matches.length) {
        const empty = document.createElement("div");
        empty.className = "state";
        empty.textContent = "No answers match that search.";
        results.append(empty);
        return;
      }

      const fragment = document.createDocumentFragment();
      for (const { item } of matches) {
        const article = document.createElement("article");
        article.className = "faq-item";
        const heading = document.createElement("h2");
        heading.textContent = item.question;
        const answer = document.createElement("div");
        answer.className = "answer";
        answer.innerHTML = renderMarkdown(item.answer);
        article.append(heading, answer);
        fragment.append(article);
      }
      results.append(fragment);
    }

    searchInput.addEventListener("input", render);
    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      render();
    });

    fetch(FAQ_SOURCE)
      .then((response) => {
        if (!response.ok) throw new Error(`FAQ source returned ${response.status}`);
        return response.text();
      })
      .then((markdown) => {
        faqItems = parseFaq(markdown);
        if (!faqItems.length) throw new Error("No question-and-answer entries were found in the FAQ source.");
        render();
      })
      .catch((error) => {
        resultCount.textContent = "FAQ could not be loaded";
        const message = document.createElement("div");
        message.className = "state error";
        message.textContent = `${error.message}. Host faq.html beside the docs folder so the source file can be loaded.`;
        results.replaceChildren(message);
      });
  </script>
</body>
</html>
